name: CI

on:
  workflow_dispatch:

env:
  ZIG_VERSION: 0.16.0
  ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00

jobs:
  build:
    name: sharun-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            env: X86_64_UNKNOWN_LINUX_MUSL
            triple: x86_64-unknown-linux-musl
            zigtarget: x86_64-linux-musl
            glibctarget: x86_64-linux-gnu.2.31
            glibc: 2.31
          - arch: aarch64
            env: AARCH64_UNKNOWN_LINUX_MUSL
            triple: aarch64-unknown-linux-musl
            zigtarget: aarch64-linux-musl
            glibctarget: aarch64-linux-gnu.2.31
            glibc: 2.31
          - arch: riscv64
            env: RISCV64GC_UNKNOWN_LINUX_MUSL
            triple: riscv64gc-unknown-linux-musl
            zigtarget: riscv64-linux-musl
            glibctarget: riscv64-linux-gnu.2.31
            glibc: 2.31
          - arch: ppc64
            env: POWERPC64_UNKNOWN_LINUX_MUSL
            triple: powerpc64-unknown-linux-musl
            zigtarget: powerpc64-linux-musl
            glibctarget: powerpc64-linux-gnu.2.31
            glibc: 2.31
          - arch: ppc64le
            env: POWERPC64LE_UNKNOWN_LINUX_MUSL
            triple: powerpc64le-unknown-linux-musl
            zigtarget: powerpc64le-linux-musl
            glibctarget: powerpc64le-linux-gnu.2.31
            glibc: 2.31
          - arch: loongarch64
            env: LOONGARCH64_UNKNOWN_LINUX_MUSL
            triple: loongarch64-unknown-linux-musl
            zigtarget: loongarch64-linux-musl
            glibctarget: loongarch64-linux-gnu.2.36
            glibc: 2.36
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup toolchain
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1
        with:
          toolchain: nightly-2026-09-11
          override: true
          target: x86_64-unknown-linux-musl

      - name: Install rust-src
        run: rustup component add rust-src --toolchain nightly-2026-09-11

      - name: Install zig
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/zig.tar.xz" \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          echo "${ZIG_SHA256}  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zig"
          tar xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1

      # zig cc rejects rustc's aarch64 --fix-cortex-a53-843419 workaround
      # arg, so the wrapper filters it out before exec'ing zig
      - name: Create zig-cc linker wrapper
        run: |
          {
            echo '#!/bin/bash'
            echo 'args=()'
            echo 'for a in "$@"; do'
            echo '  case "$a" in *fix-cortex-a53-843419*) continue ;; esac'
            echo '  args+=("$a")'
            echo 'done'
            echo "exec \"$RUNNER_TEMP/zig/zig\" cc -target ${{ matrix.zigtarget }} \"\${args[@]}\""
          } > "$RUNNER_TEMP/zigcc"
          chmod +x "$RUNNER_TEMP/zigcc"

      - name: Build
        run: |
          export CARGO_TARGET_${{ matrix.env }}_LINKER="$RUNNER_TEMP/zigcc"
          export RUSTFLAGS="-C target-feature=+crt-static -C link-self-contained=no"
          export ZIG_GLOBAL_CACHE_DIR="$RUNNER_TEMP/zig-cache"
          export ZIG_LOCAL_CACHE_DIR="$RUNNER_TEMP/zig-cache"
          cargo build --release --target ${{ matrix.triple }}
          mv "target/${{ matrix.triple }}/release/sharun" "sharun-${{ matrix.arch }}"

      - name: Strip
        run: |
          git clone -q https://github.com/aunali1/super-strip.git
          make -C super-strip
          ./super-strip/sstrip "sharun-${{ matrix.arch }}"

      # ppc64 (BE) is ELFv2 but zig's powerpc64-linux-gnu glibc stub is the
      # ELFv1 one (GLIBC_2.3/2.4), which archlinuxpower's glibc does not
      # define. Build a BE copy of zig's ppc64le ELFv2 stub and link the
      # preloads against it, see tools/gen-elfv2-stubs.sh
      # https://github.com/pkgforge-dev/Anylinux-sharun/issues/11
      - name: Gen ppc64 ELFv2 stubs
        if: matrix.arch == 'ppc64'
        run: |
          export ZIG_GLOBAL_CACHE_DIR="$RUNNER_TEMP/zig-cache"
          export ZIG_LOCAL_CACHE_DIR="$RUNNER_TEMP/zig-cache"
          sh tools/gen-elfv2-stubs.sh "$RUNNER_TEMP/zig/zig" "${{ matrix.glibc }}" "$RUNNER_TEMP/ppc64-stub"
          echo "PPC64_ELFV2_STUB=$RUNNER_TEMP/ppc64-stub" >> "$GITHUB_ENV"

      # Build the quick-sharun preload libs against an old glibc floor so
      # they load with any glibc >= the floor (2.36 is the minimum for
      # loongarch64, glibc never supported that arch before it)
      - name: Build libs
        run: |
          export ZIG_GLOBAL_CACHE_DIR="$RUNNER_TEMP/zig-cache"
          export ZIG_LOCAL_CACHE_DIR="$RUNNER_TEMP/zig-cache"
          make -C lib CC="$RUNNER_TEMP/zig/zig cc -target ${{ matrix.glibctarget }}" LDFLAGS=-s

      - name: Verify libs
        run: |
          floor="GLIBC_${{ matrix.glibc }}"
          for so in lib/*.so; do
            max=$(objdump -T "$so" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1)
            high=$(printf '%s\n' "$floor" "$max" | sort -uV | tail -n 1)
            echo "$so: needs at most ${max:-none} (floor: $floor)"
            if [ "$high" != "$floor" ]; then
              echo "ERROR: $so requires $max, which is newer than the floor $floor" >&2
              exit 1
            fi
            if [ "${{ matrix.arch }}" = ppc64 ]; then
              # ppc64 bundles archlinuxpower's ELFv2 glibc, whose lowest
              # version is 2.17; an ELFv1 name would be fatal at launch
              # https://github.com/pkgforge-dev/Anylinux-sharun/issues/11
              min=$(objdump -T "$so" | grep -o 'GLIBC_[0-9.]*' | sort -uV | head -n 1)
              if [ "$(printf '%s\n' GLIBC_2.17 "${min:-GLIBC_2.17}" | sort -uV | head -n 1)" != "GLIBC_2.17" ]; then
                echo "ERROR: $so requires ${min}, older than GLIBC_2.17" >&2
                exit 1
              fi
            fi
            # No lib may hold link-time references to symbols of any bundled
            # library, only libc and libdl imports are allowed. A stray one is
            # fatal on apps that do not ship that library, this is what broke
            # Pinta when the glycin fix was part of gtk-class-fix.so
            # https://github.com/pkgforge-dev/Pinta-AppImage/issues/17
            # Weak symbols are matched too, the CRT artifacts they add are
            # whitelisted below. The whole line is matched because ppc64 ELFv2
            # prints an extra localentry column between the version and name
            bad=$(objdump -T "$so" | awk '
              $0 ~ /\*UND\*/ {
                name = $NF;
                if (name ~ /^(_ITM_|__gmon_start__)/) next;
                if ($0 ~ /\(GLIBC_/) next;
                if (name ~ /^dl/) next;
                print name
              }' | sort -u)
            if [ -n "$bad" ]; then
              echo "ERROR: $so has link-time references to non-libc symbols:" >&2
              echo "$bad" | sed 's/^/  /' >&2
              exit 1
            fi
          done

      # Single tar with sharun + the libs so consumers (quick-sharun) can
      # grab everything in one download without building on the host.
      # Flat layout on purpose, no nested directory and no leading ./
      # Files inside carry no arch, the tar name already has it
      - name: Package
        run: |
          mkdir pkg
          cp "sharun-${{ matrix.arch }}" pkg/sharun
          cp lib/*.so pkg/
          tar_name="sharun+helper-libs-${{ matrix.arch }}.tar"
          ( cd pkg && tar -cf "../$tar_name" -- * )
          rm -rf pkg
          if tar -tf "$tar_name" | grep -q '/'; then
            echo "ERROR: tar contains nested paths" >&2
            exit 1
          fi
          tar -tvf "$tar_name"
          sha256sum "sharun-${{ matrix.arch }}" > "sharun-${{ matrix.arch }}.sha256"
          sha256sum "$tar_name" > "$tar_name.sha256"
          cat *.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sharun-${{ matrix.arch }}
          path: |
            sharun-${{ matrix.arch }}
            sharun-${{ matrix.arch }}.sha256
            sharun+helper-libs-${{ matrix.arch }}.tar
            sharun+helper-libs-${{ matrix.arch }}.tar.sha256

  release:
    name: Draft release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: sharun-*
          merge-multiple: true

      - name: Get version
        run: |
          chmod +x sharun-*
          cp sharun-x86_64 sharun
          echo "VERSION=$(./sharun --version | awk '{print $NF}')" >> "${GITHUB_ENV}"

      - name: Check tag doesn't exist
        run: |
          if git ls-remote --tags origin "refs/tags/$VERSION" | grep -q "$VERSION"; then
            echo "Error: tag $VERSION already exists. Bump the version in Cargo.toml first."
            exit 1
          fi

      - name: Draft Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: "${{ env.VERSION }}"
          tag_name: "${{ env.VERSION }}"
          prerelease: false
          draft: true
          generate_release_notes: true
          make_latest: true
          files: |
            sharun-*
            sharun+helper-libs-*
