cargo-features = ["panic-immediate-abort"]

[package]
name = "sharun"
version = "3.2.2"
readme = "README.md"
license = "MIT"
repository = "https://github.com/pkgforge-dev/Anylinux-sharun"
description = "Run dynamically linked ELF binaries everywhere"
edition = "2021"

[profile.release]
lto = true
opt-level = "z"
strip = "symbols"
debug  = false
codegen-units = 1
panic = "immediate-abort"

[profile.dev]
opt-level = 0

[dependencies]
goblin = "0.8.2"
walkdir = "2.5.0"
userland-execve = { git = "https://github.com/pkgforge-dev/userland-execve-rust", tag = "v0.3.2" }
nix = { version = "0.31.1", features = [ "fs", "ptrace", "signal", "process" ] }
